
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terminal-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: terminal-app
  template:
    metadata:
      labels:
        app: terminal-app
    spec:
      containers:
      - name: terminal-app
        image: swarali22/terminal-app:latest
        imagePullPolicy: Always
